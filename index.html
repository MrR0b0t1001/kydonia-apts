<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kydonia Apts</title>
    <link rel="icon" href="/images/logo-3.jpg" />

    <style>
      @font-face {
        font-family: "Source Sans 3";
        src: url("/fonts/source-sans-3-woff.woff2") format("woff2");
        font-weight: 200 900;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "boxicons";
        src: url("/fonts/boxicons.woff2") format("woff2");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      body {
        font-family:
          "Source Sans 3",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Arial,
          sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: black;
      }

      html {
        scroll-behavior: smooth;
        scroll-padding-top: 5.5rem;
        scrollbar-gutter: stable;
      }

      /* Respect users who prefer reduced motion */
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
        }
      }

      /* Firefox / modern standard scrollbar styling */
      html {
        scrollbar-width: thin;
        scrollbar-color: rgba(15, 23, 42, 0.28) transparent;
      }

      /* Chrome, Edge, Safari */
      ::-webkit-scrollbar {
        width: 0.55rem;
        height: 0.55rem;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background-color: rgba(15, 23, 42, 0.22);
        border: 0.16rem solid transparent;
        border-radius: 999px;
        background-clip: padding-box;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(15, 23, 42, 0.36);
      }

      ::-webkit-scrollbar-thumb:active {
        background-color: rgba(15, 23, 42, 0.46);
      }

      ::-webkit-scrollbar-corner {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
